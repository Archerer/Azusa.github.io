<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Chat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 840px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    h1 {
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 14px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      margin-top: 12px;
    }
    .result {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ddd;
      background: #fafafa;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>AI Agent 对话页</h1>

  <div class="form-group">
    <label for="baseUrl">后端地址</label>
    <input id="baseUrl" value="http://127.0.0.1:8091" />
  </div>

  <div class="form-group">
    <label for="agentId">Agent ID</label>
    <input id="agentId" value="100003" />
  </div>

  <div class="form-group">
    <label for="userId">用户 ID</label>
    <input id="userId" value="test-user" />
  </div>

  <div class="form-group">
    <label for="message">消息内容</label>
    <textarea id="message">你具备哪些skill技能</textarea>
  </div>

  <button id="sendBtn">发送</button>

  <div class="result" id="result">结果会显示在这里</div>

  <script src="./js/chat.js"></script>
</body>
</html>
